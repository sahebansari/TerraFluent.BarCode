name: Bug report
description: Something is encoded, rendered or validated incorrectly.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and OS
      placeholder: .NET 8 on Windows 11, .NET Framework 4.8, ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Code that reproduces it
      render: csharp
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
      description: Include the scanner or decoder you used if a code does not scan.
    validations:
      required: true
