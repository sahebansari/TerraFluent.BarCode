name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows also runs the tests on .NET Framework 4.8 (net48), the main consumer of the netstandard2.0 build.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Coverage is collected on Linux only: coverlet rewrites the assemblies it instruments, which breaks
      # their strong-name signature, and .NET Framework (net48, Windows) refuses to load them.
      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: dotnet test tests/TerraFluent.BarCode.Tests/TerraFluent.BarCode.Tests.csproj --configuration Release --no-build

      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest'
        run: dotnet test tests/TerraFluent.BarCode.Tests/TerraFluent.BarCode.Tests.csproj --configuration Release --no-build --collect "XPlat Code Coverage" --results-directory test-results

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: test-results/**/coverage.cobertura.xml

  pack:
    name: Pack
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Pack
        run: dotnet pack src/TerraFluent.BarCode/TerraFluent.BarCode.csproj --configuration Release --output artifacts

      - name: Upload package artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-packages
          path: artifacts/*.*nupkg
